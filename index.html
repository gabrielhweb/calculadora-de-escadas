<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Zilinski - Escadas Personalizadas</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuração de cores para o tema
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#f3f4f6',   // Fundo do site (Cinza muito claro)
              secondary: '#ffffff', // Fundo dos cards (Branco)
              accent: '#e5e7eb',    // Fundo dos inputs (Cinza claro)
              highlight: '#f59e0b', // Laranja/Dourado (Destaque)
              dark: '#111827',      // Preto/Chumbo para textos
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      /* ===== Estilo "Oficina" (cara de obra/galpão) ===== */
      .of-stencil { font-family: 'Saira Stencil One', Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; font-weight: 400; }
      .of-zebra { height: 10px; background: repeating-linear-gradient(45deg, #111827 0 12px, #fbbf24 12px 24px); }
      /* Placa de aço parafusada: canto reto, chapa cinza e 4 parafusos nos cantos */
      html .of-plate {
        position: relative; border-radius: 0 !important;
        background-color: #f3f4f6; border: 1px solid #9ca3af;
        box-shadow: inset 0 1px 0 #ffffff, 0 1px 2px rgba(0,0,0,.08);
        background-image:
          radial-gradient(circle at 10px 10px, #6b7280 0 2.5px, #e5e7eb 3px, transparent 4px),
          radial-gradient(circle at calc(100% - 10px) 10px, #6b7280 0 2.5px, #e5e7eb 3px, transparent 4px),
          radial-gradient(circle at 10px calc(100% - 10px), #6b7280 0 2.5px, #e5e7eb 3px, transparent 4px),
          radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #6b7280 0 2.5px, #e5e7eb 3px, transparent 4px);
      }
      /* Título com a faixa zebrada embaixo */
      .of-title { padding-bottom: 12px; background: repeating-linear-gradient(45deg, #111827 0 10px, #fbbf24 10px 20px) left bottom / 100% 6px no-repeat; }
      /* Oficina = canto reto em tudo; .keep-round mantém o arredondado (cartões metálicos de Meus Contratos) */
      :is(main, aside) :is(.rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-2xl):not(.keep-round) { border-radius: 0 !important; }
      html.dark .of-plate { background-color: #1f2937; border-color: #4b5563; box-shadow: inset 0 1px 0 #374151; }
      /* Previne zoom automático e indesejado no mobile (iOS e Android) ao focar em inputs */
      @media screen and (max-width: 768px) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }
      /* Força contraste alto nos inputs para resolver problema de leitura no modo claro */
      html:not(.dark) input, html:not(.dark) select {
        color: #000000 !important; 
        font-weight: 900 !important;
      }
      /* Ajuste para modo escuro */
      .dark input, .dark select {
        font-weight: 700 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
</head>
  <body class="bg-gradient-to-br from-gray-50 to-blue-50 text-dark dark:from-gray-900 dark:to-gray-800 dark:text-gray-100 transition-colors duration-200 min-h-screen">
