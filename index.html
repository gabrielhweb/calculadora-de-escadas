<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zilinski - Escadas Personalizadas</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuração de cores para o tema
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#f3f4f6',   // Fundo do site (Cinza muito claro)
              secondary: '#ffffff', // Fundo dos cards (Branco)
              accent: '#e5e7eb',    // Fundo dos inputs (Cinza claro)
              highlight: '#f59e0b', // Laranja/Dourado (Destaque)
              dark: '#111827',      // Preto/Chumbo para textos
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      /* Força contraste alto nos inputs para resolver problema de leitura no modo claro */
      html:not(.dark) input, html:not(.dark) select {
        color: #000000 !important; 
        font-weight: 900 !important;
      }
      /* Ajuste para modo escuro */
      .dark input, .dark select {
        font-weight: 700 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
</head>
  <body class="bg-gradient-to-br from-gray-50 to-blue-50 text-dark dark:from-gray-900 dark:to-gray-800 dark:text-gray-100 transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <!-- O PONTO (.) ABAIXO É CRUCIAL PARA O VERCEL -->
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
