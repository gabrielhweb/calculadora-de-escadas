<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zilinski - Escadas Personalizadas</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuração de cores para o tema CLARO (Light Mode)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#f3f4f6',   // Fundo do site (Cinza muito claro)
              secondary: '#ffffff', // Fundo dos cards (Branco)
              accent: '#e5e7eb',    // Fundo dos inputs (Cinza claro)
              highlight: '#f59e0b', // Laranja/Dourado (Destaque)
              dark: '#111827',      // Preto/Chumbo para textos
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      /* Força contraste alto nos inputs para resolver problema de leitura */
      input, select {
        color: #000000 !important; 
        font-weight: 900 !important;
      }
    </style>
  </head>
  <body class="bg-primary text-dark">
    <div id="root"></div>
    <!-- Versão Limpa - Sem ImportMap -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
